/* Layout: one centred lab-bench column; stepper on top, each step is a "station" with a live instrument panel */
:root{

  --f-data:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --panel:#161e33; --ink:#e8edf7; --muted:#9aa6bf; --line:#2a3550;
  --sun:#f5a13a; --sun-ink:#f5a13a; --sun-soft:#3a2a12; --teal:#3cc1b0; --teal-soft:#123532;
  --violet:#b48af0; --violet-soft:#2b1f44; --go:#6c9cff; --err:#ff8a70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --panel:#161e33; --ink:#e8edf7; --muted:#9aa6bf; --line:#2a3550;
  --sun:#f5a13a; --sun-ink:#f5a13a; --sun-soft:#3a2a12; --teal:#3cc1b0; --teal-soft:#123532;

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:3px solid var(--sun)}

.panel{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.scene{width:100%;aspect-ratio:480/300;height:auto;display:block;border-radius:12px;max-width:100%}

ol.how{padding-left:22px;margin:0 0 14px}

.chart-wrap{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:10px 8px 4px}

.legend .lh::before{background:repeating-linear-gradient(90deg,var(--teal) 0 5px,transparent 5px 8px)}
.legend .ls::before{background:repeating-linear-gradient(90deg,var(--violet) 0 5px,transparent 5px 8px)}
.scrub-text{font-weight:700;font-variant-numeric:tabular-nums}
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}

.phase{border-radius:12px;padding:12px;border:1.5px solid var(--line);background:var(--panel)}
.phase .lbl{font:700 12px var(--f-data);letter-spacing:.08em;text-transform:uppercase}
.phase .v{font:800 30px var(--f-display);font-stretch:85%;font-variant-numeric:tabular-nums}
.phase .pct{font-family:var(--f-data);font-size:13px;color:var(--muted)}
.phase.flat .lbl{color:var(--sun)} .phase.half .lbl{color:var(--teal)} .phase.side .lbl{color:var(--violet)}
table{border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px;width:100%}
th,td{padding:4px 10px;border-bottom:1px solid var(--line);text-align:right}

.pills button.cur{background:var(--go);border-color:var(--go);color:#fff}
.cer{font:700 12px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--sun);margin:0}
.hint{background:var(--sun-soft);border-radius:10px;padding:10px 12px;font-size:14px;margin:8px 0 12px;max-width:none}
.report-out{white-space:pre-wrap;font-size:15px;line-height:1.6}
.report-out h4{font-family:var(--f-display);margin:14px 0 4px}

/* ---- learning: checkpoints, findings, challenge ---- */
.checkpoint{border:2px solid var(--sun);background:color-mix(in srgb,var(--sun) 8%,var(--panel));border-radius:14px;padding:14px;margin:12px 0;animation:rise .4s var(--ease) both}
.checkpoint h3{display:flex;gap:8px;align-items:center;margin:0 0 4px}
.checkpoint .tagline{font:700 11px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--sun)}
.findings{width:100%;border-collapse:separate;border-spacing:0;margin-top:8px;font-size:15px}
.findings th{font:700 11px var(--f-data);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px;border-bottom:1.5px solid var(--line)}
.findings td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.findings input{width:100%;font:15px var(--f-body);padding:7px 9px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.findings input.num{font-family:var(--f-data);max-width:120px}
.findings input:focus{border-color:var(--go);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--go) 16%,transparent)}
.challenge{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
@media (max-width:640px){.challenge{grid-template-columns:1fr}}
.target{position:relative;height:16px;border-radius:8px;background:var(--line);overflow:hidden;margin:8px 0}
.target i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,color-mix(in srgb,var(--sun) 70%,#fff),var(--sun));transition:width .2s}
.target b{position:absolute;top:-3px;bottom:-3px;width:3px;left:50%;background:var(--ink);border-radius:2px}
.win{color:var(--teal);font-weight:800;font-family:var(--f-display);font-size:20px}
/* ---- voiceover ---- */
button.vo{display:inline-flex;align-items:center;gap:6px}
button.vo[aria-pressed=true]{background:var(--go);border-color:var(--go);color:#fff}
.listen{display:inline-flex;align-items:center;gap:6px;font:700 12px var(--f-body);padding:5px 11px;border-radius:20px;border:1.5px solid var(--line);background:var(--panel);color:var(--go);margin:0 0 8px;cursor:pointer}
.speaking{background:color-mix(in srgb,var(--sun) 22%,transparent);box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 22%,transparent);border-radius:6px;transition:background-color .25s,box-shadow .25s}
/* ---- polish layer: depth, motion, type ---- */
:root{--sh1:0 1px 2px rgba(20,33,58,.05),0 3px 8px -2px rgba(20,33,58,.07);--sh2:0 2px 4px rgba(20,33,58,.05),0 18px 36px -12px rgba(20,33,58,.24);--hl:rgba(255,255,255,.75);--ease:cubic-bezier(.2,.8,.2,1)}

:root[data-theme="dark"]{--sh1:0 1px 2px rgba(0,0,0,.4),0 4px 10px -2px rgba(0,0,0,.35);--sh2:0 2px 6px rgba(0,0,0,.45),0 22px 40px -12px rgba(0,0,0,.6);--hl:rgba(255,255,255,.05)}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"kern","liga"}
h2{letter-spacing:-.02em;line-height:1.04}
p{text-wrap:pretty}
.eyebrow{display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:16px;height:2px;border-radius:2px;background:currentColor}
.panel,.chart-wrap{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 95%,var(--line)));border-color:color-mix(in srgb,var(--line) 70%,transparent);box-shadow:var(--sh1),inset 0 1px 0 var(--hl)}

.choice:hover,.phase:hover{transform:translateY(-3px);box-shadow:var(--sh2)}

button{transition:transform .18s var(--ease),box-shadow .18s var(--ease),background-color .2s,border-color .2s,color .2s}

button.sun{background:linear-gradient(180deg,color-mix(in srgb,var(--sun) 84%,#fff),var(--sun));box-shadow:0 1px 0 rgba(255,255,255,.35) inset,0 6px 14px -6px color-mix(in srgb,var(--sun) 75%,transparent)}
button.teal{background:linear-gradient(180deg,color-mix(in srgb,var(--teal) 86%,#fff),var(--teal))}

.stepper button::before{transition:background-color .4s var(--ease),transform .4s var(--ease);transform-origin:left}
.stepper button.current::before{box-shadow:0 0 0 3px color-mix(in srgb,var(--go) 18%,transparent)}

.pills button{transition:transform .2s var(--ease),background-color .2s,box-shadow .2s}

.hint{border:1px solid color-mix(in srgb,var(--sun) 30%,transparent)}
section[data-step]:not([hidden]){animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* Prediction check */
.pc{margin:6px 0 16px;border-width:2px}
.pc.ok{border-color:var(--teal);background:linear-gradient(180deg,var(--teal-soft),var(--panel) 70%)}
.pc.no{border-color:var(--violet);background:linear-gradient(180deg,var(--violet-soft),var(--panel) 70%)}
.pc h3{margin:2px 0 12px;font-size:20px;text-wrap:balance}
.pc-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.pc figure{margin:0;flex:1 1 180px;min-width:0;display:grid;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.pc figcaption{font:700 11px var(--f-data);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.pc svg{width:100%;max-width:150px;height:auto}
.pc-pred{fill:none;stroke:var(--sun);stroke-width:3;stroke-linecap:round;stroke-dasharray:5 4}
.pc-data{fill:none;stroke:var(--go);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.pc-vs{font:800 30px var(--f-display,inherit);color:var(--muted)}
.pc.ok .pc-vs{color:var(--teal)}.pc.no .pc-vs{color:var(--violet)}
.pc-msg{margin:12px 0 8px}
.pc-q{display:block;font-weight:700;margin:4px 0 6px}
.pc textarea{width:100%;box-sizing:border-box}

/* Report check */
.rc{border-width:2px;border-color:var(--go)}
.rc h3{margin:2px 0 10px;outline:none}
.rc-list{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.rc-list li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--panel);border:1.5px solid var(--line)}
.rc-list li.ok{background:var(--teal-soft);border-color:transparent}
.rc-list li.todo{background:var(--sun-soft);border-color:transparent}
.rc-i{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--panel)}
.rc-list li.ok .rc-i{color:var(--teal)}
.rc-list li.todo .rc-i{color:var(--sun-ink)}
.rc-list button{margin-left:4px}

function runTrial(iv){return new Promise(res=>{const dur=E.trial.seconds;S.running={iv,p:0,t:0};$("btnTrial").disabled=true;
  const t0=performance.now();let last=t0;
  const step=now=>{if(!S.running)return res(null);const d=(now-last)/1000;last=now;if(!S.paused)S.running.t+=d*(S.auto?S.speed:1)*(E.trial.rate||1);
    const p=Math.min(1,S.running.t/dur);S.running.p=p;$("trialBar").style.width=(p*100)+"%";
    const lab=E.trial.label(S.running.t,p);$("trialInfo").textContent=lab;if(window.LabKit&&Math.floor(S.running.t)!==S.lastSec){S.lastSec=Math.floor(S.running.t);LabKit.time(lab)}
    tween($("rd3"),E.trial.live?E.trial.live(iv,p,S.ex):model(iv)*p,E.dv.decimals);
    if(p>=1){const v=noisy(model(iv));S.running=null;$("btnTrial").disabled=false;tween($("rd3"),v,E.dv.decimals);
      const ex=S.trials.find(r=>r.iv===iv&&!r.manual);if(ex)ex.dv=v;else S.trials.push({iv,dv:v,note:""});
      S.trials.sort((a,b)=>a.iv-b.iv);drawChart($("chart3"));renderFindings();$("toAnalyze").disabled=S.trials.filter(r=>r.dv!=null).length<3;
      $("trialInfo").textContent=`Recorded: ${fmt(iv,E.iv.decimals||0)} ${E.iv.unit} → ${fmt(v,E.dv.decimals)} ${E.dv.unit}`;return res(v)}
    requestAnimationFrame(step)};requestAnimationFrame(step)})}
$("btnTrial").onclick=()=>{if(!S.running)runTrial(+$("iv3").value)};
$("autoSpeed").onchange=e=>S.speed=+e.target.value;
$("btnAuto").onclick=async()=>{if(S.auto){S.paused=!S.paused;updAuto();return}
  S.auto=true;S.paused=false;S.cp={};updAuto();
  for(let i=0;i<E.conditions.length&&S.auto;i++){const v=E.conditions[i];await glide(v);await runTrial(v);
    const cp=E.checkpoints.find(c=>c.after===i);if(cp&&!S.cp[cp.key]){S.cp[cp.key]=1;await checkpoint(cp)}}
  S.auto=false;S.paused=false;updAuto()};
function glide(v){return new Promise(res=>{const from=+$("iv3").value,t0=performance.now(),d=reduce?1:600/S.speed;
  const step=now=>{const k=Math.min(1,(now-t0)/d);$("iv3").value=from+(v-from)*(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);upd3();if(k<1)requestAnimationFrame(step);else{$("iv3").value=v;upd3();res()}};requestAnimationFrame(step)})}
function updAuto(){$("btnAuto").textContent=S.auto?(S.paused?"Resume":"Pause"):"Autoplay all trials";$("btnTrial").disabled=S.auto||!!S.running}
function checkpoint(cp){return new Promise(res=>{S.paused=true;updAuto();const h=$("cpHolder");
  h.innerHTML=`<div class="checkpoint" role="group" aria-labelledby="cpq"><span class="tagline">Notice and wonder · paused</span><h3 id="cpq">${esc(cp.q)}</h3><p class="muted" style="font-size:14px;margin:0 0 8px">${esc(cp.hint)}</p>
   <textarea id="cpA" rows="2" placeholder="I notice… I wonder…"></textarea><div class="rec-row"><button class="primary" id="cpGo">Save and continue</button><button class="small speak" data-for="cpA">Speak</button></div></div>`;
  bindSpeak(h);h.scrollIntoView({block:"center",behavior:reduce?"auto":"smooth"});$("cpA").focus({preventScroll:true});if(VO.on)readEls([$("cpq")]);
  $("cpGo").onclick=()=>{save(cp.key,$("cpA").value.trim());h.innerHTML="";S.paused=false;updAuto();res()}})}

/* ---------- chart ---------- */
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function nice(v){const p=Math.pow(10,Math.floor(Math.log10(v||1)));for(const m of[1,2,2.5,5,10])if(m*p>=v)return m*p}
function drawChart(svg,o={}){svg.innerHTML="";const W=760,H=330,L=72,R=24,T=24,B=54,pw=W-L-R,ph=H-T-B;
  const pts=S.trials.filter(r=>r.dv!=null&&r.iv!=null);const ymax=nice(Math.max(model(E.iv.max),...pts.map(p=>p.dv),model(E.iv.min))*1.1);
  const X=v=>L+(v-E.iv.min)/(E.iv.max-E.iv.min)*pw,Y=v=>T+ph-v/ymax*ph,f={"font-family":"Atkinson Hyperlegible, sans-serif","font-size":13,fill:"var(--muted)"};
  for(let i=0;i<=5;i++){const v=ymax*i/5;el("line",{x1:L,x2:L+pw,y1:Y(v),y2:Y(v),stroke:"var(--line)"},svg);el("text",{...f,x:L-8,y:Y(v)+4,"text-anchor":"end"},svg).textContent=fmt(v,ymax<10?1:0)}
  const step=nice((E.iv.max-E.iv.min)/6);for(let v=Math.ceil(E.iv.min/step)*step;v<=E.iv.max+1e-9;v+=step){el("text",{...f,x:X(v),y:T+ph+20,"text-anchor":"middle"},svg).textContent=fmt(v,step<1?1:0)}
  el("line",{x1:L,x2:L+pw,y1:T+ph,y2:T+ph,stroke:"var(--ink)","stroke-width":1.5},svg);el("line",{x1:L,x2:L,y1:T,y2:T+ph,stroke:"var(--ink)","stroke-width":1.5},svg);
  el("text",{...f,x:L+pw/2,y:H-8,"text-anchor":"middle","font-weight":700,fill:"var(--ink)"},svg).textContent=`${E.iv.name} (${E.iv.unit})`;
  el("text",{...f,x:18,y:T+ph/2,"text-anchor":"middle","font-weight":700,fill:"var(--ink)",transform:`rotate(-90 18 ${T+ph/2})`},svg).textContent=`${E.dv.name} (${E.dv.unit})`;
  if(o.model){let d="";for(let i=0;i<=60;i++){const v=E.iv.min+(E.iv.max-E.iv.min)*i/60;d+=(i?"L":"M")+X(v).toFixed(1)+" "+Y(model(v)).toFixed(1)}el("path",{d,fill:"none",stroke:"var(--violet)","stroke-width":2,"stroke-dasharray":"6 5"},svg)}
  if(!pts.length){el("text",{...f,x:L+pw/2,y:T+ph/2,"text-anchor":"middle","font-size":15},svg).textContent="Run a trial to see your results here";return{X,Y}}
  if(pts.length>1)el("path",{d:pts.map((p,i)=>(i?"L":"M")+X(p.iv).toFixed(1)+" "+Y(p.dv).toFixed(1)).join(""),fill:"none",stroke:"var(--sun)","stroke-width":2.5,"stroke-linejoin":"round"},svg);
  pts.forEach((p,i)=>el("circle",{cx:X(p.iv),cy:Y(p.dv),r:o.sel===i?8:5.5,fill:o.sel===i?"var(--panel)":"var(--sun)",stroke:o.sel===i?"var(--ink)":"var(--panel)","stroke-width":2.5},svg));
  return{X,Y}}

/* ---------- prediction check: predict, observe, explain ---------- */
const SHAPE={flat:"stays about the same","up-line":"goes up steadily","up-curve":"goes up, but less and less",
  "down-line":"goes down steadily","down-curve":"drops fast, then levels off"};
function dataPts(){return S.trials.filter(r=>r.dv!=null&&r.iv!=null).slice().sort((a,b)=>a.iv-b.iv)}
function dataShape(){const p=dataPts();if(p.length<3)return null;const xs=p.map(r=>+r.iv),ys=p.map(r=>+r.dv);
  const mn=Math.min(...ys),mx=Math.max(...ys),mean=ys.reduce((a,b)=>a+b,0)/ys.length;
  if((mx-mn)/Math.max(Math.abs(mean),1e-9)<0.12)return "flat";
  const x0=xs[0],x1=xs[xs.length-1],y0=ys[0],y1=ys[ys.length-1],dir=y1>y0?"up":"down";let dev=0;
  for(let i=1;i<p.length-1;i++)dev+=ys[i]-(y0+(y1-y0)*(xs[i]-x0)/((x1-x0)||1));
  dev=dev/(p.length-2)/(Math.abs(y1-y0)||1);
  return dir+((dir==="up"?dev>0.08:dev<-0.08)?"-curve":"-line")}
function dataPath(){const p=dataPts();const xs=p.map(r=>+r.iv),ys=p.map(r=>+r.dv);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return p.map((r,i)=>(i?"L":"M")+(6+60*(r.iv-x0)/((x1-x0)||1)).toFixed(1)+" "+(38-30*(r.dv-y0)/((y1-y0)||1)).toFixed(1)).join(" ")}
function predMatches(pr,ds){const want=pr.shape||"";return ds===want||ds.split("-")[0]===want}
function renderPredCheck(){const el=$("predCheck"),ds=dataShape(),pr=E.predictions.find(x=>x.k===S.prediction);
  if(!el)return;if(!ds||!pr||!pr.shape){el.hidden=true;return}
  const ok=predMatches(pr,ds);S.answers._predmatch=ok?"yes":"no";S.answers._datashape=SHAPE[ds];
  if(window.LabKit){LabKit.saveResponse("_predmatch",S.answers._predmatch);LabKit.saveResponse("_datashape",SHAPE[ds])}
  const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
  el.className="panel pc "+(ok?"ok":"no");el.hidden=false;
  el.innerHTML=`<p class="eyebrow">Prediction check</p><h3>${ok?"Your evidence backs up your prediction":"Your evidence tells a different story"}</h3>
   <div class="pc-row"><figure><figcaption>You predicted</figcaption><svg viewBox="0 0 72 44" aria-hidden="true"><path d="${esc(pr.p)}" class="pc-pred"/></svg><b>${esc(pr.t)}</b></figure>
   <span class="pc-vs" aria-hidden="true">${ok?"=":"≠"}</span>
   <figure><figcaption>Your data shows</figcaption><svg viewBox="0 0 72 44" aria-hidden="true"><path d="${dataPath()}" class="pc-data"/></svg><b>${esc(cap(SHAPE[ds]))}</b></figure></div>
   <p class="pc-msg">${ok?"Nice. Now the important part: explain <b>why</b> it happens.":"That's not a mistake, it's science. Scientists change their minds when the evidence disagrees with them."}</p>
   <label for="pcWhy" class="pc-q">${ok?"What in your data convinced you?":"What surprised you, and what do you think now?"}</label>
   <textarea id="pcWhy" rows="2" placeholder="${ok?"My data shows…":"I thought… but my data shows… so now I think…"}"></textarea>
   <button class="small speak" data-for="pcWhy">Speak my answer</button>`;
  $("pcWhy").value=S.answers.predrethink||"";$("pcWhy").oninput=e=>save("predrethink",e.target.value);bindSpeak(el)}
function renderAnalyze(){const pts=S.trials.filter(r=>r.dv!=null&&r.iv!=null);const sc=$("scrub");sc.max=Math.max(0,pts.length-1);
  const upd=()=>{const i=+sc.value,p=pts[i];drawChart($("chart4"),{model:$("showModel").checked,sel:i});
    $("scrubText").textContent=p?`At ${fmt(p.iv,E.iv.decimals||0)} ${E.iv.unit}, the ${E.dv.name.toLowerCase()} was ${fmt(p.dv,E.dv.decimals)} ${E.dv.unit}`:""};
  sc.oninput=upd;$("showModel").onchange=upd;upd();renderPredCheck();setTimeout(updCh,0)}
function updCh(){const v=+$("chIv").value,y=model(v);$("chIvO").textContent=fmt(v,E.iv.decimals||0)+" "+E.iv.unit;tween($("chRd"),y,E.dv.decimals);
  if(Math.abs(y-E.challenge.target)/E.challenge.target<=E.challenge.tolerance){$("chWin").textContent=`You found it: ${fmt(v,E.iv.decimals||0)} ${E.iv.unit}.`;$("chWhy").hidden=false;
    if(!S.answers.challenge){save("challenge",fmt(v,E.iv.decimals||0)+" "+E.iv.unit)}}else $("chWin").textContent=""}
$("chIv").oninput=updCh;$("chGuess").onchange=e=>save("challengeGuess",e.target.value);$("chWhyT").onchange=e=>save("challengeWhy",e.target.value);

function phases(){const o={};S.trials.filter(r=>r.dv!=null&&r.iv!=null).forEach(r=>o[fmt(r.iv,E.iv.decimals||0)+" "+E.iv.unit]=+(+r.dv).toFixed(4));return o}
function renderPrompt(){$("final").hidden=true;$("checkBox").hidden=true;$("promptBox").hidden=false;const pills=$("pills");pills.innerHTML="";
  E.cer.forEach((p,i)=>{const b=document.createElement("button");b.textContent=i+1;b.setAttribute("aria-label","Question "+(i+1));b.className=(i===S.pIdx?"cur ":"")+((S.answers[p.k]||"").trim()?"filled":"");b.onclick=()=>{S.pIdx=i;renderPrompt()};pills.appendChild(b)});

/* ---------- report check: feedback before sending ---------- */
function reportChecks(){const A=k=>(S.answers[k]||"").trim(),words=t=>(t.match(/[\p{L}\p{N}]+/gu)||[]).length;
  const part=q=>/claim/i.test(q.tag)?"claim":/evidence/i.test(q.tag)?"evidence":/reason/i.test(q.tag)?"reasoning":"other";
  const first=p=>E.cer.find(q=>part(q)===p),txt=p=>E.cer.filter(q=>part(q)===p).map(q=>A(q.k)).join(" ");const out=[];
  const cq=first("claim");if(cq){const c=txt("claim").toLowerCase(),iv=(E.iv.short||E.iv.name).toLowerCase(),dv=E.dv.name.toLowerCase();
    const vars=(iv+" "+dv).match(/\p{L}{4,}/gu)||[];const hit=vars.some(w=>c.includes(w.slice(0,Math.max(4,w.length-2))));
    out.push({ok:words(c)>=6&&hit,label:"Claim",good:"says how the variables are related.",tip:words(c)<6?"Write your claim as one full sentence.":`Say how the ${iv} changes the ${dv}.`,k:cq.k})}
  const eq=first("evidence");if(eq){const n=(txt("evidence").match(/\d+(?:[.,]\d+)?/g)||[]).length;
    out.push({ok:n>=2,label:"Evidence",good:"uses numbers from your own data.",tip:n?"Compare at least two of your results, with units.":`Add numbers from your findings table, with units (${E.dv.unit}).`,k:eq.k})}
  const rq=first("reasoning");if(rq){const r=txt("reasoning"),link=/\b(because|so|therefore|this means|which means|due to|as a result|since)\b/i.test(r);
    out.push({ok:words(r)>=12&&link,label:"Reasoning",good:"explains why, not just what.",tip:!link?"Explain why it happens. Try starting with \u201cThis happens because\u2026\u201d":"Add more detail: link your evidence to the science idea.",k:rq.k})}
  const pr=E.predictions.find(x=>x.k===S.prediction),ds=dataShape();
  if(pr&&ds&&pr.shape&&!predMatches(pr,ds))out.push({ok:(S.answers.predrethink||"").trim().length>10,label:"Prediction",good:"you explained what changed your mind.",tip:"Your data didn't match your prediction. Say what changed your mind.",go:4});
  const empty=E.cer.filter(q=>!A(q.k));if(empty.length)out.push({ok:false,label:"Unanswered",tip:`${empty.length} question${empty.length>1?"s are":" is"} still empty.`,k:empty[0].k});
  return out}
function showCheck(){const list=reportChecks(),todo=list.filter(c=>!c.ok);
  if(S.answers._checkfirst==null)save("_checkfirst",String(todo.length));
  $("promptBox").hidden=true;const box=$("checkBox");box.hidden=false;
  box.innerHTML=`<p class="eyebrow">Before you send it</p><h3 tabindex="-1">${todo.length?"Make your report even stronger":"Your report is ready to send"}</h3>
   <ul class="rc-list">${list.map((c,i)=>`<li class="${c.ok?"ok":"todo"}"><span class="rc-i" aria-hidden="true">${c.ok?"✓":"✎"}</span><div><b>${esc(c.label)}</b>${c.ok?": "+esc(c.good):": "+esc(c.tip)+` <button class="small" data-fix="${i}">Fix this</button>`}</div></li>`).join("")}</ul>
   <div class="nav"><button id="rcBack">Keep improving</button><button class="primary" id="rcSend">${todo.length?"Send it anyway":"Send to my teacher"}</button></div>`;
  box.querySelectorAll("[data-fix]").forEach(b=>b.onclick=()=>{const c=list[+b.dataset.fix];box.hidden=true;if(c.go!=null){go(c.go);setTimeout(()=>{const t=$("pcWhy");if(t){t.scrollIntoView({block:"center"});t.focus()}},500)}else{S.pIdx=Math.max(0,E.cer.findIndex(q=>q.k===c.k));renderPrompt();$("pAns").focus()}});
  $("rcBack").onclick=()=>{const c=todo.find(x=>x.k)||{};S.pIdx=c.k?Math.max(0,E.cer.findIndex(q=>q.k===c.k)):0;renderPrompt()};
  $("rcSend").onclick=()=>{save("_checksend",String(todo.length));box.hidden=true;finish()};
  box.querySelector("h3").focus();if(VO.on)setTimeout(()=>readEls([...box.querySelectorAll("h3,li")]),200)}
function reportText(){const L=[E.title.toUpperCase()+" – EXPERIMENT REPORT","",`Data: ${S.mode==="sim"?"simulation":"real measurements"}`,"My findings:"];
  S.trials.forEach(r=>L.push(`  ${fmt(r.iv,E.iv.decimals||0)} ${E.iv.unit}: ${r.dv==null?"—":fmt(r.dv,E.dv.decimals)+" "+E.dv.unit}${r.note?" — "+r.note:""}`));
  if(S.answers.challenge)L.push(`Challenge: ${S.answers.challenge} (my guess: ${S.answers.challengeGuess||"—"}). ${S.answers.challengeWhy||""}`);
  E.checkpoints.forEach((c,i)=>{if(S.answers[c.key])L.push(`Notice and wonder ${i+1}: ${S.answers[c.key]}`)});L.push("");
  const pr=E.predictions.find(x=>x.k===S.prediction),ds=dataShape();
  if(pr){L.push("MY PREDICTION");L.push(`I predicted: ${pr.t}.${S.answers.prediction_why?" "+S.answers.prediction_why.trim():""}`);
    if(ds&&pr.shape)L.push(`My data showed it ${SHAPE[ds]}, so my prediction ${predMatches(pr,ds)?"was supported":"was not supported"}.`);
    if((S.answers.predrethink||"").trim())L.push(S.answers.predrethink.trim());L.push("")}
  const part=q=>/claim/i.test(q.tag)?"CLAIM":/evidence/i.test(q.tag)?"EVIDENCE":/reason/i.test(q.tag)?"REASONING":"GOING FURTHER";
  let n=0;["CLAIM","EVIDENCE","REASONING","GOING FURTHER"].forEach(h=>{const qs=E.cer.filter(q=>part(q)===h);if(!qs.length)return;L.push(h);
    qs.forEach(q=>{n++;L.push(`${n}. ${q.q}`);L.push((S.answers[q.k]||"(not answered)").trim())});L.push("")});return L.join("\n")}
function finish(){$("promptBox").hidden=true;$("final").hidden=false;$("reportOut").textContent=reportText();
  if(window.LabKit)LabKit.submit({prediction:(E.predictions.find(x=>x.k===S.prediction)||{}).t||"",answers:S.answers,phases:phases(),
    findings:S.trials.map(r=>[`${fmt(r.iv,E.iv.decimals||0)} ${E.iv.unit}`,r.dv==null?"":`${fmt(r.dv,E.dv.decimals)} ${E.dv.unit}`,r.note||""]),
    source:S.mode,readings:S.trials.filter(r=>r.dv!=null).length,report:reportText()})}

  for(const n of pref){const v=vs.find(x=>x.name.startsWith(n));if(v)return v}return vs.find(v=>/^en[-_](AU|GB|US)/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||vs[0]}
function stopVO(){if(hasTTS)speechSynthesis.cancel();document.querySelectorAll(".speaking").forEach(e=>e.classList.remove("speaking"))}
function readEls(els){stopVO();if(!hasTTS)return;els.filter(e=>e&&e.offsetParent&&e.textContent.trim()).forEach(e=>{const u=new SpeechSynthesisUtterance(e.textContent.replace(/\s+/g," ").replace(/°/g," degrees").trim());
  if(VO.voice){u.voice=VO.voice;u.lang=VO.voice.lang}u.rate=.95;u.onstart=()=>{document.querySelectorAll(".speaking").forEach(x=>x.classList.remove("speaking"));e.classList.add("speaking")};u.onend=u.onerror=()=>e.classList.remove("speaking");speechSynthesis.speak(u)})}
function readStage(i){const s=document.querySelector(`section[data-step="${i}"]`);readEls([...s.querySelectorAll("h2,p,ol.how li,.choice b,.choice small")].filter(e=>!e.matches(".eyebrow,.scrub-text")&&!e.closest(".nav,.report-out")))}
if(hasTTS){VO.voice=pick();try{speechSynthesis.addEventListener("voiceschanged",()=>VO.voice=pick())}catch(e){}$("btnVO").hidden=false;
  $("btnVO").onclick=()=>{VO.on=!VO.on;$("btnVO").setAttribute("aria-pressed",VO.on);$("btnVOL").textContent=VO.on?"Reading aloud":"Read aloud";if(VO.on)readStage(S.step);else stopVO()};
  document.querySelectorAll("section[data-step] h2").forEach(h=>{const b=document.createElement("button");b.type="button";b.className="listen";b.innerHTML=spk(14)+"Listen";b.onclick=()=>readStage(+h.closest("section").dataset.step);h.parentNode.insertBefore(b,h)})}
function bindSpeak(scope){(scope||document).querySelectorAll(".speak").forEach(b=>{if(b._b)return;b._b=1;b.hidden=!(LK()&&LK().dictate);b.onclick=async()=>{const t=$(b.dataset.for);const old=b.textContent;b.textContent="Listening…";
  try{const said=await LabKit.dictate();t.value=(t.value?t.value.trimEnd()+" ":"")+said;t.dispatchEvent(new Event("input"))}catch(e){b.textContent=e.message;setTimeout(()=>b.textContent=old,3000);return}b.textContent=old}})}
bindSpeak();
go(0);window.__aisxBooted=true;
})();
